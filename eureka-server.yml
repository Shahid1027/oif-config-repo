server:
  port: 8761

spring:
  application:
    name: eureka-server

  # NEW: fetch config from config-server on startup
  config:
    import: configserver:http://localhost:8888

eureka:
  client:
    # Eureka server doesn't need to register with itself
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false       # (dev only — turn back on in prod)

# LAYER 1 ADDITION: control Eureka's own logging noise.
# Values here OVERRIDE logback-spring.xml, so you can toggle without rebuilding.
logging:
  level:
    # Silence the chatty Netflix internals
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
    com.netflix.appinfo: WARN

    # Keep Spring Cloud Eureka wrapper visible — this is where
    # "Registered instance ..." / "Renewed lease ..." messages come from.
    org.springframework.cloud.netflix.eureka: INFO

    # General framework
    org.springframework: INFO
